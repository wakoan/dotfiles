# System-level key remapping. keyd sits below the compositor, so these apply
# in the TTY and on the hyprlock screen too, unlike the kb_options in
# hyprland.conf (which only bind inside a Hyprland session).
#
# Install:
#   sudo cp etc/keyd/default.conf /etc/keyd/default.conf
#   sudo systemctl restart keyd

[ids]
# Apple Internal Keyboard / Trackpad, as reported by `sudo keyd monitor`.
# An [ids] section that matches nothing makes keyd a silent no-op: it starts,
# logs "DEVICE: ignoring ..." for every device, and remaps nothing. The id
# commented out in the previous version (05ac:0267) was the wrong one.
05ac:0263

[main]
capslock = esc

# Cmd is left alone here: unmapped keys pass through untouched, so the
# identity mappings the previous version carried were no-ops that keyd warns
# about. The layer below is what swaps Cmd for Ctrl.

# Cmd acts as Ctrl, so macOS muscle memory works in fullscreen Chromium where
# Hyprland's SUPER binds are not available.
#
# NOTE: nothing activates this layer. keyd switches layers either from a key
# bound to layer(chromium_fullscreen), or from keyd-application-mapper, which
# needs ~/.config/keyd/app.conf and a running mapper process -- neither exists
# here, and the mapper has no Hyprland window backend. The layer is kept so
# the mapping is not lost, but it is inert until something triggers it.
[chromium_fullscreen]
# layer(control) rather than a direct `= leftcontrol` assignment: keyd warns
# about the latter because it emits the keycode instead of behaving as a
# modifier, which breaks chords. Control keys need no entry -- they already
# are what we want.
leftmeta = layer(control)
rightmeta = layer(control)
