# iwd configuration.
#
# Install:
#   sudo cp etc/iwd/main.conf /etc/iwd/main.conf
#   sudo systemctl restart iwd
#
# Note this laptop uses the Broadcom BCM4360 with the proprietary `wl`
# driver, which is FullMAC and exposes only connect/disconnect to
# userspace -- no authenticate/associate, no scheduled scan, and
# "max scan IEs length: 0". That rules out 802.11r fast transition and
# 802.11k/v steering, so an EasyMesh network cannot hand this client
# between APs; the most iwd can do is notice a weak signal and
# reassociate to a stronger BSS on its own.

[General]
# iwd runs its own DHCP client, so no dhcpcd/networkd is needed.
EnableNetworkConfiguration=true

# Defaults are -70 (2.4GHz) and -76 (5GHz). At -76 a laptop sitting at
# -70 dBm never even considers moving, which on a mesh means it stays on
# the far AP indefinitely. Raise both so a roam is attempted while the
# link is still good enough to complete one.
RoamThreshold=-65
RoamThreshold5G=-65

# Below these iwd treats the link as failing and roams urgently.
CriticalRoamThreshold=-75
CriticalRoamThreshold5G=-75

# Default is 60s. A failed roam against a sticky FullMAC firmware is
# common, so retry sooner rather than waiting out a full minute.
RoamRetryInterval=20
