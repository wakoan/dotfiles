# Stop a stray power-button tap from killing the machine.
#
# Install:
#   sudo mkdir -p /etc/systemd/logind.conf.d
#   sudo cp etc/systemd/logind.conf.d/10-power-key.conf /etc/systemd/logind.conf.d/
#   sudo systemctl restart systemd-logind      # ends the graphical session
#
# On this MacBook the power key sits at the top right of the keyboard, next to
# Delete and the volume keys, and logind's default HandlePowerKey=poweroff
# shuts down instantly with no prompt. The journal shows five accidental
# presses (2026-08-01, 09-07, 10-13, and twice on 10-24), each one a clean
# poweroff in the middle of a session.

[Login]
# A short press now locks the session instead of powering off: recoverable,
# and still a useful thing for the key to do.
HandlePowerKey=lock

# Holding the key for a few seconds still powers the machine off, so a
# deliberate shutdown by key remains possible.
HandlePowerKeyLongPress=poweroff
