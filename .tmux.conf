# prefix
set prefix C-b

# bind-key C-a send-prefix
bind-key C-b send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# TODO check if vim with split
bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "select-pane -R"

# ESC pause
set -s escape-time 0

# Enable mouse control (clickable windows, panes, resizable panes).
# tmux 2.1 replaced the three mouse-* options below with one `mouse` option.
# set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

set-window-option -g mode-keys vi

# Setup 'v' to begin selection as in Vim.
# tmux 2.4 replaced the vi-copy key table with copy-mode-vi, where the copy
# commands are arguments to send-keys -X rather than commands of their own.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

######################
### DESIGN CHANGES ###
######################

# tmux 2.9 merged the separate -fg/-bg/-attr options into one -style option
# per element, so each block below is a single `set` where there used to be
# two or three.

# panes
set -g pane-border-style "fg=colour238,bg=colour235"
set -g pane-active-border-style "fg=colour51,bg=colour236"

## Status bar design
set -g status-justify left
set -g status-interval 2
set -g status-position bottom
set -g status-style "fg=colour137,bg=colour234,dim"
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# messaging
set -g message-style "fg=colour232,bg=colour166,bold"
set -g message-command-style "fg=blue,bg=black"

# window mode
setw -g clock-mode-colour colour135
setw -g mode-style "fg=colour196,bg=colour238,bold"

# window status
setw -g window-status-current-style "fg=colour81,bg=colour238,bold"
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style "fg=colour138,bg=colour235,none"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style "fg=colour255,bg=colour1,bold"

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "screen-256color"
