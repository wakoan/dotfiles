# Catppuccin Mocha — matches waybar / mako / wofi

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color  = rgb(cdd6f4)
    fail_color  = rgb(f38ba8)
    check_color = rgb(f9e2af)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">󰌾  Enter password</span>
    fail_text = <span foreground="##f38ba8">Wrong password ($ATTEMPTS)</span>
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cdd6f4)
    font_size = 84
    font_family = InputMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a6adc8)
    font_size = 18
    font_family = InputMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
