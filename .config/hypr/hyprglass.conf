# Built from HyprGlass v0.8.0 for Hyprland 0.56.2.
# Hyprland does not load plugins from a config keyword -- `plugin = <path>`
# parses without error and does nothing, which is why the glass was silently
# absent after every reboot and `hyprctl plugin list` came back empty. Loading
# is a runtime action, so it goes through exec-once; this is what hyprpm does
# too. The plugin:hyprglass block below is read at parse time regardless.
exec-once = hyprctl plugin load ~/.local/lib/hyprglass/hyprglass.so

plugin:hyprglass {
    # Regular windows keep their existing appearance.
    enabled = 0
    default_theme = dark
    # Glass strength is separate from the QML background's 50% tint opacity.
    preset = name:switcher, inherits:glass, glass_opacity:1.0, blur_strength:2.5, refraction_strength:0.8, chromatic_aberration:0.6, fresnel_strength:0.8, specular_strength:0.8, lens_distortion:0.25, edge_thickness:0.12
    layers {
        enabled = 1
        namespaces = window-switcher
        preset = switcher
        mask_mode = alpha
        namespace_mask_thresholds = window-switcher=0.05
        manage_blur = 1
        live_resample_fps = 30
    }
}

# Per-window whitelist.
#
# `enabled = 0` above turns the effect off for regular windows, which the
# plugin documents as the way to run a whitelist: a window opts in by tag.
# Ghostty's own class is com.mitchellh.ghostty; the org.wako.* windows are
# also ghostty (launch-tui.sh sets those classes for the bar popups), so they
# are matched too.
windowrule = tag +hyprglass_enabled, match:class ^(com\.mitchellh\.ghostty|org\.wako\..*)$

# Glass has nothing to refract behind an opaque window, and a fullscreen one
# has nothing behind it at all.
windowrule = tag +hyprglass_disabled, match:fullscreen 1
