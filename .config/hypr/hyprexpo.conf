# Exposé-style workspace overview.
#
# Built from https://github.com/sandwichfarm/hyprexpo at commit 5891014, which
# that project's hyprpm.toml pins to Hyprland efb5099 (0.56.2) -- the exact
# build running here. hyprwm dropped the original hyprexpo as unmaintained;
# this is the maintained continuation.
#
# Rebuild after a Hyprland upgrade:
#   cd ~/projects/aur/hyprexpo && git fetch && git checkout <pin for new ver>
#   make all && cp hyprexpo.so ~/.local/lib/hyprexpo/

# Hyprland does not load plugins from a config keyword -- `plugin = <path>`
# parses and silently does nothing. Loading is a runtime action.
exec-once = hyprctl plugin load ~/.local/lib/hyprexpo/hyprexpo.so

plugin:hyprexpo {
    # 4 persistent workspaces sit evenly in a 2x2 grid.
    columns = 2
    # Keep the current workspace centred rather than jumping the grid around.
    workspace_method = center current
    # Show empty workspaces too: the overview doubles as a map of where to
    # move a window, which needs the empty slots visible.
    skip_empty = false
    label_font_size = 16
}
