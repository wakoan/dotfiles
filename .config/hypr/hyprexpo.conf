# Exposé-style workspace overview.
#
# Built from https://github.com/sandwichfarm/hyprexpo at commit 5891014, which
# that project's hyprpm.toml pins to Hyprland efb5099 (0.56.2) -- the exact
# build running here. hyprwm dropped the original hyprexpo as unmaintained;
# this is the maintained continuation.
#
# Rebuild after a Hyprland upgrade:
#   cd ~/projects/aur/hyprexpo && git fetch && git checkout <pin for new ver>
#   make all && cp hyprexpo.so ~/.local/lib/hyprexpo/

# Hyprland does not load plugins from a config keyword -- `plugin = <path>`
# parses and silently does nothing. Loading is a runtime action.
#
# The trailing reload is required, not cosmetic. `gesture = 3, up, dispatcher,
# hyprexpo:expo` is validated while the config is parsed, which happens before
# any exec-once runs -- so on a fresh start the dispatcher does not exist yet,
# the gesture fails to register, and Hyprland raises its error overlay with
# "Invalid dispatcher: hyprexpo:expo". Re-parsing once the plugin is loaded
# registers the gesture and clears the overlay. Keybinds resolve their
# dispatcher lazily at press time, so `bindd` never hit this.
#
# Safe to reload here: no `exec =` lines exist, so nothing is re-spawned, and
# loaded plugins survive a config reload.
exec-once = hyprctl plugin load ~/.local/lib/hyprexpo/hyprexpo.so && hyprctl reload

plugin:hyprexpo {
    # rows = 0 means "follow columns", so this is a columns x columns grid:
    # 3 gives nine slots, covering workspaces 1-9. waybar declares only four
    # persistent workspaces, but in practice 1,2,4,5,6,7,9 are all in use, and
    # a 2x2 grid silently hid everything above 4.
    columns = 3

    # Grow the grid when the active workspace falls outside it, rather than
    # leaving it off-screen. Caps at seven columns.
    dynamic_grid = true
    # Keep the current workspace centred rather than jumping the grid around.
    workspace_method = center current
    # Show empty workspaces too: the overview doubles as a map of where to
    # move a window, which needs the empty slots visible.
    skip_empty = false
    label_font_size = 16
}
