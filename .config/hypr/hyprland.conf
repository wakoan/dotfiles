monitor=,preferred,auto,1.5

exec-once = waybar -c $HOME/.config/hypr/waybar.conf -s $HOME/.config/hypr/waybar.css
exec-once = hypridle
exec-once = mako
exec-once = $HOME/.config/hypr/scripts/wallpaper.sh

input {
    kb_layout=
    kb_variant=
    kb_model=
    # kb_options=
    kb_rules=
    # kb_options=caps:swapescape
    kb_options=caps:escape # Use caps lock as escape
    #,fkeys:basic_1-12


    follow_mouse = 1
    repeat_rate = 25
    repeat_delay = 200 # 170

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.4
    }
    sensitivity = 0.0 # for mouse cursor
}

misc {
  # Reduce frames sent when idle
  # TODO vfr = true
}

bind = SUPER, Q, killactive,
bind = SUPER, space, exec, wofi --show drun
bind = SUPER, M, fullscreen
bind = SUPER, N, fullscreenstate,  3 0
# TODI windowrulev2 = fullscreenstate 0 0, class:^(Chromium)$
bind = SUPER, Escape, exec, loginctl lock-session  # lock screen

# To switch between windows in a floating workspace:
bind = SUPER, Tab, cyclenext         # Change focus to another window
bind = SUPER, Tab, bringactivetotop  # Bring it to the top

bindr = SUPER, A, layoutmsg, rollnext

# Mac-style browser shortcuts — only fire when a browser is focused
bind = SUPER, T, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh T  # new tab
bind = SUPER, W, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh W  # close tab
bind = SUPER, L, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh L  # address bar
bind = SUPER, R, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh R  # reload page
bind = SUPER, F, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh F  # find in page
bind = SUPER SHIFT, T, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh T SHIFT  # reopen closed tab

# Mac-style copy/paste everywhere (terminals get CTRL+SHIFT, GUI apps get CTRL)
bind = SUPER, C, exec, $HOME/.config/hypr/scripts/mac-clipboard.sh C
bind = SUPER, V, exec, $HOME/.config/hypr/scripts/mac-clipboard.sh V

# Volume / media keys (F10=mute, F11/F12=down/up, F7/F8/F9=prev/play/next)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = ,XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = ,XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = ,XF86AudioPlay,        exec, playerctl play-pause
bindl  = ,XF86AudioNext,        exec, playerctl next
bindl  = ,XF86AudioPrev,        exec, playerctl previous

# Brightness — keyboard backlight (F5/F6) and screen (F1/F2)
bindel = ,XF86KbdBrightnessUp,   exec, brightnessctl -d smc::kbd_backlight set +10%
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl -d smc::kbd_backlight set 10%-
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl -d intel_backlight set +5%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -d intel_backlight set 5%-

# Notifications (mako)
bind = SUPER, X, exec, makoctl dismiss
bind = SUPER SHIFT, X, exec, makoctl dismiss --all
bind = SUPER, Z, exec, makoctl restore

bind=SUPER,left,movefocus,l
bind=SUPER,right,movefocus,r
bind=SUPER,up,movefocus,u
bind=SUPER,down,movefocus,d

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10

# Move focused window to workspace
bind=SUPER SHIFT,1,movetoworkspace,1
bind=SUPER SHIFT,2,movetoworkspace,2
bind=SUPER SHIFT,3,movetoworkspace,3
bind=SUPER SHIFT,4,movetoworkspace,4
bind=SUPER SHIFT,5,movetoworkspace,5
bind=SUPER SHIFT,6,movetoworkspace,6
bind=SUPER SHIFT,7,movetoworkspace,7
bind=SUPER SHIFT,8,movetoworkspace,8
bind=SUPER SHIFT,9,movetoworkspace,9
bind=SUPER SHIFT,0,movetoworkspace,10

# Swap window positions (moved to SUPER+SHIFT: SUPER+L is now the browser address bar)
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d

general {
    gaps_in=2
    gaps_out=0
    border_size=2
    col.active_border=rgba(cba6f7ff) rgba(89b4faff) rgba(94e2d5ff) 10deg
    col.inactive_border=0xff45475a
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 3
    }
    shadow {
      enabled = true
      range = 100
      render_power=5
      color= 0x33000000
      color_inactive=0x22000000
    }
}

animations {
    enabled=1
    bezier=overshot,0.13,0.99,0.29,1.03
    animation=windows,1,4,overshot,slide
    animation=windowsMove,1,2,overshot   # fullscreen / un-fullscreen, resize
    animation=border,1,10,default
    animation=fade,1,10,default
    animation=workspaces,1,6,overshot,slide
}
