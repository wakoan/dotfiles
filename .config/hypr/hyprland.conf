monitor=,preferred,auto,1.5

exec-once = waybar -c $HOME/.config/hypr/waybar.conf -s $HOME/.config/hypr/waybar.css
exec-once = hypridle
exec-once = mako
exec-once = $HOME/.config/hypr/scripts/wallpaper.sh

input {
    kb_layout=
    kb_variant=
    kb_model=
    # kb_options=
    kb_rules=
    # kb_options=caps:swapescape
    kb_options=caps:escape # Use caps lock as escape
    #,fkeys:basic_1-12


    follow_mouse = 1
    repeat_rate = 25
    repeat_delay = 200 # 170

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.4
    }
    sensitivity = 0.0 # for mouse cursor
}

misc {
  # Reduce frames sent when idle
  # TODO vfr = true
}

bindd = SUPER, Q, Close window, killactive,
bindd = SUPER, Return, Terminal, exec, ghostty
bindd = SUPER, space, Launch apps, exec, wofi --show drun
bindd = SUPER SHIFT, space, Switch window or tmux pane, exec, $HOME/.config/hypr/scripts/switcher.sh
bindd = SUPER, K, Show key bindings, exec, $HOME/.config/hypr/scripts/keybindings.sh

# Blur the translucent wofi launcher.
# Hyprland 0.56 layerrule syntax: <prop> <value>, match:<field> <value>
layerrule = blur on, match:namespace wofi

bindd = SUPER, M, Full screen, fullscreen
bindd = SUPER, N, Full screen (app unaware), fullscreenstate, 3 0
bindd = SUPER, Escape, Lock screen, exec, loginctl lock-session
bindd = SUPER SHIFT, S, Screenshot region, exec, $HOME/.config/hypr/scripts/screenshot-region.sh

# Wallpaper (swaybg reads the current-wallpaper symlink)
bindd = SUPER, P, Next wallpaper, exec, $HOME/.config/hypr/scripts/wallpaper-cycle.sh
bindd = SUPER SHIFT, P, Previous wallpaper, exec, $HOME/.config/hypr/scripts/wallpaper-cycle.sh -p

# Cycle focus, then raise the newly focused window
bindd = SUPER, Tab, Cycle windows, cyclenext
bind  = SUPER, Tab, bringactivetotop

bindr = SUPER, A, layoutmsg, rollnext

# Mac-style browser shortcuts — only fire when a browser is focused
bindd = SUPER, T, New browser tab, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh T
bindd = SUPER, W, Close browser tab, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh W
bindd = SUPER, L, Focus address bar, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh L
bindd = SUPER, R, Reload page, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh R
bindd = SUPER, F, Find in page, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh F
bindd = SUPER SHIFT, T, Reopen closed tab, exec, $HOME/.config/hypr/scripts/mac-shortcut.sh T SHIFT

# Mac-style copy/paste everywhere (terminals get CTRL+SHIFT, GUI apps get CTRL)
bindd = SUPER, C, Copy, exec, $HOME/.config/hypr/scripts/mac-clipboard.sh C
bindd = SUPER, V, Paste, exec, $HOME/.config/hypr/scripts/mac-clipboard.sh V

# Volume / media keys (F10=mute, F11/F12=down/up, F7/F8/F9=prev/play/next)
binddel = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binddel = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddl  = ,XF86AudioMute, Mute audio, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddl  = ,XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binddl  = ,XF86AudioPlay, Play / pause, exec, playerctl play-pause
binddl  = ,XF86AudioNext, Next track, exec, playerctl next
binddl  = ,XF86AudioPrev, Previous track, exec, playerctl previous

# Brightness — keyboard backlight (F5/F6) and screen (F1/F2)
binddel = ,XF86KbdBrightnessUp, Keyboard backlight up, exec, brightnessctl -d smc::kbd_backlight set +10%
binddel = ,XF86KbdBrightnessDown, Keyboard backlight down, exec, brightnessctl -d smc::kbd_backlight set 10%-
binddel = ,XF86MonBrightnessUp, Screen brightness up, exec, brightnessctl -d intel_backlight set +5%
binddel = ,XF86MonBrightnessDown, Screen brightness down, exec, brightnessctl -d intel_backlight set 5%-

# Notifications (mako)
bindd = SUPER, X, Dismiss notification, exec, makoctl dismiss
bindd = SUPER SHIFT, X, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER, Z, Restore notification, exec, makoctl restore

bindd = SUPER, left, Focus left, movefocus, l
bindd = SUPER, right, Focus right, movefocus, r
bindd = SUPER, up, Focus up, movefocus, u
bindd = SUPER, down, Focus down, movefocus, d

bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10

bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# Swap window positions (SUPER+L is the browser address bar, so these use SHIFT)
bindd = SUPER SHIFT, H, Swap window left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

# Windows opened from the bar float centered. Terminal TUIs get the class
# org.wako.<command> from scripts/launch-tui.sh; native GUI apps bring their
# own class, so they are matched by name.
windowrule = tag +bar-popup, match:class ^org\.wako\..*$
windowrule = tag +bar-popup, match:class (?i).*(pavucontrol|blueman|iwgtk|missioncenter).*
windowrule = float on, match:tag bar-popup
windowrule = center on, match:tag bar-popup
windowrule = size 900 620, match:tag bar-popup

general {
    gaps_in=2
    gaps_out=0
    border_size=2
    col.active_border=rgba(cba6f7ff) rgba(89b4faff) rgba(94e2d5ff) 10deg
    col.inactive_border=0xff45475a
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 3
    }
    shadow {
      enabled = true
      range = 100
      render_power=5
      color= 0x33000000
      color_inactive=0x22000000
    }
}

animations {
    enabled=1
    bezier=overshot,0.13,0.99,0.29,1.03
    animation=windows,1,4,overshot,slide
    animation=windowsMove,1,2,overshot   # fullscreen / un-fullscreen, resize
    animation=border,1,10,default
    animation=fade,1,10,default
    animation=workspaces,1,6,overshot,slide
}
