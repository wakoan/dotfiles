<?xml version="1.0" encoding="UTF-8"?>
<!-- No icon theme ships a tmux icon, so this is a hand-drawn stand-in:
     a terminal split into panes, in tmux's status-bar green on the
     Catppuccin Mocha base used by the rest of the desktop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="2" y="2" width="44" height="44" rx="9" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2.5"/>
  <!-- pane divisions -->
  <line x1="24" y1="9" x2="24" y2="33" stroke="#a6e3a1" stroke-width="2" opacity="0.75"/>
  <line x1="24" y1="21" x2="40" y2="21" stroke="#a6e3a1" stroke-width="2" opacity="0.75"/>
  <!-- prompt in the left pane -->
  <polyline points="11,15 15,18.5 11,22" fill="none" stroke="#cdd6f4" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="11" y1="27" x2="19" y2="27" stroke="#cdd6f4" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <!-- status bar -->
  <rect x="7" y="37" width="34" height="3.5" rx="1.75" fill="#a6e3a1"/>
</svg>
