# Read by Arch's chromium launcher at startup.
#
# Hardware video decode. The GPU here is an Iris Pro 5200 (Haswell), driven by
# libva-intel-driver (i965) -- vainfo reports H.264, MPEG-2, VC-1 and JPEG
# decode. Chromium does not trust i965 by default, hence the blocklist flag.
#
# Worth knowing the ceiling: this hardware predates VP9 and AV1, so YouTube
# still decodes on the CPU unless something forces H.264.
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder
--ignore-gpu-blocklist

# Keep decoded frames on the GPU instead of copying them through system memory.
--enable-zero-copy

# Run natively on Wayland rather than through XWayland.
--ozone-platform-hint=auto
